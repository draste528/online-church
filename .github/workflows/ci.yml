name: Analytics & Code Quality Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  analytics-test-and-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r analytics/requirements.txt -r backend/requirements.txt httpx

      - name: Run Ruff Linter
        run: |
          ruff check analytics/src analytics/tests analytics/dags/church_appointments_weekly.py backend/app backend/tests

      - name: Execute Pytest Test Suite
        env:
          PYTHONPATH: .
          APPOINTMENTS_TEST_DATABASE_URL: postgresql+psycopg2://postgres:test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
        run: |
          pytest -v analytics/tests backend/tests

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
